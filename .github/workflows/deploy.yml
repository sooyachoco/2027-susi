name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-2027-susi
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install OpenNext Cloudflare adapter
        run: npm install --no-save --ignore-scripts @opennextjs/cloudflare@1.20.17

      - name: Type check
        run: npx tsc --noEmit

      - name: Regular scoring smoke tests
        run: npm run test:regular

      - name: Build Next.js and Cloudflare Worker
        run: npm run build:worker

      - name: Deploy Worker
        run: npx @opennextjs/cloudflare@1.20.17 deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
