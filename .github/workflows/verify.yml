name: Verify application

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Cloudflare build tool
        run: npm install --no-save --ignore-scripts @opennextjs/cloudflare@1.20.5
      - name: Type check
        run: npx tsc --noEmit
      - name: Next.js production build
        run: npm run build
      - name: Cloudflare Worker build
        run: npm run build:worker
